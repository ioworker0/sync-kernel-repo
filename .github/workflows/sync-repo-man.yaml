name: SYNC REPO MAN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        path: sync-repo

    # - name: use SSH key
    #   run: |
    #     mkdir -p ~/.ssh
    #     echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
    #     chmod 600 ~/.ssh/id_rsa
    - name: Create GitHub App token for target repo
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: ioworker0
        repositories: linux
        permission-contents: write

    - name: clone repo
      run: |
        git clone -v git://git.kernel.org/pub/scm/linux/kernel/git/stable/linux

    - name: sync linux repo
      run: |
        set -euo pipefail
        cd linux
        git checkout master
        git pull --ff-only
        for branch in linux-7.2.y linux-6.18.y linux-6.12.y linux-6.6.y linux-6.1.y linux-5.15.y linux-5.10.y; do
          git checkout "$branch"
          git pull --ff-only
          git push --force \
            https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/ioworker0/linux.git \
            "HEAD:refs/heads/$branch"
        done
